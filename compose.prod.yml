name: kura-v4
x-app: &app
  image: kura-v4:local
  build: .
  environment:
    DATABASE_URL: ${DATABASE_URL:?Set a PostgreSQL URL using host postgres and port 5432}
    KURA_ADDR: 0.0.0.0:8094
    KURA_MEDIA_DIR: /data/media
    KURA_PUBLIC_URL: ${KURA_PUBLIC_URL:?Set the public HTTPS URL}
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true
  tmpfs: ["/tmp:size=256m,mode=1777"]
  stop_grace_period: 20s
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong password}
      POSTGRES_DB: ${POSTGRES_DB:-kura}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    command: ["migrate"]
    profiles: ["tools"]
    depends_on:
      postgres: { condition: service_healthy }
  app:
    <<: *app
    command: ["serve"]
    restart: unless-stopped
    volumes:
      - media_data:/data/media
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8094/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      KURA_DOMAIN: ${KURA_DOMAIN:?Set your domain}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app: { condition: service_healthy }
volumes:
  postgres_data:
  media_data:
  caddy_data:
  caddy_config:
